controller_manager:
  ros__parameters:
    use_sim_time: true

# Sim uses the same IMU + EKF pipeline as the real robot (imu_ekf.launch.py), so the EKF
# publishes odom->base_link and diff_cont must not (same as my_controllers.yaml).
diff_cont:
  ros__parameters:
    enable_odom_tf: false
    # TEMPORARY sim-only override: the URDF wheels (robot_core.xacro: radius 0.05, y = +/-0.175)
    # do not match the real robot values in my_controllers.yaml yet. Remove these two lines once
    # the URDF is updated to the rebuilt robot (see CLAUDE.md, "Drive calibration").
    wheel_separation: 0.35
    wheel_radius: 0.05
