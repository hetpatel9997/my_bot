controller_manager:
  ros__parameters:
    use_sim_time: true

# Sim uses the same IMU + EKF pipeline as the real robot (imu_ekf.launch.py), so the EKF
# publishes odom->base_link and diff_cont must not (same as my_controllers.yaml).
diff_cont:
  ros__parameters:
    enable_odom_tf: false
    # No wheel override any more (removed 2026-10-18): the URDF (weedbot_properties.xacro) uses the
    # same wheel_radius / wheel_separation as my_controllers.yaml, so sim and robot share one set.
