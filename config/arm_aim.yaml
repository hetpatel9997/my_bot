# Arm aim + spray (sub-project 1, simulation). One section per node (spray_controller, weed_aim);
# launch/arm_aim.launch.py starts both.
#   ros2 run my_bot spray_controller_node.py --ros-args --params-file config/arm_aim.yaml
# Only spray_seconds and zones_file can be changed while the node runs (ros2 param set); every
# other spray_controller parameter is fixed at start (read-only: a change is refused loudly).

spray_controller:
  ros__parameters:
    # Always wall time, also in Gazebo: the node refuses to start with use_sim_time true (sim
    # time can run slow or stop; the spray and the safety timers count real seconds).
    use_sim_time: false
    # sim = no hardware, the relay state is only published on /spray/relay (the sim has no pump).
    # gpio = real relay on a Pi pin through lgpio (sub-project 4; not installed on the VM).
    backend: sim
    # Start armed? Honoured ONLY with backend sim; with gpio the node always starts disarmed and
    # the owner arms it with: ros2 service call /spray/arm std_srvs/srv/SetBool "{data: true}"
    start_armed: false
    # Spray time per trigger (s). Read at every trigger. Hard cap 3.0 s in the code: a bigger
    # value still sprays only 3.0 s.
    spray_seconds: 1.0
    # Keepout zones (same format as config/backyard_zones.yaml, the pool guard's file). '' = no
    # zones: the keepout check is skipped and the log says so. Zones set but no map transform ->
    # every spray is refused. Re-read whenever this parameter changes.
    zones_file: ''

    odom_topic: /odom
    joint_states_topic: /joint_states
    e_stop_topic: /e_stop
    safety_state_topic: /safety_state

    # CLAUDE.md hard rule: spray only while /safety_state is "clear" and at most this old (s).
    safety_max_age: 0.5
    # Robot still = speed < still_linear (m/s) and turn rate < still_angular (rad/s) for
    # still_time (s); no /odom for odom_timeout (s) = refuse (we cannot tell if it moves).
    still_linear: 0.01
    still_angular: 0.02
    still_time: 0.5
    odom_timeout: 1.0
    # Arm still = every arm joint moved less than arm_still_speed (rad/s) over arm_still_time (s),
    # from joint positions; no arm joint states for joint_states_timeout (s) = refuse.
    arm_still_speed: 0.02
    arm_still_time: 0.3
    joint_states_timeout: 0.5
    # The nozzle line must hit the ground within ground_reach (m) of arm_base: pointing down at
    # a weed next to the robot, never up or out across the yard.
    ground_reach: 0.8
    # Never spray the robot itself: if the nozzle line hits the ground inside this box (base_link,
    # metres: [x from, x to, y from, y to] = the robot seen from above, i.e. the LiDAR self-filter
    # box plus 3 cm on every side), the spray is refused with "nozzle aimed at the robot". Why: in
    # the parked pose the nozzle points straight down at x 0.107, onto the phone holder 5 cm
    # under the tip. Weeds are aimed at from x 0.25 on, so real aims are never stopped by it.
    robot_box: [-0.56, 0.21, -0.19, 0.19]

    base_frame: base_link       # z = 0 is the ground
    map_frame: map              # frame of the keepout zones
    arm_base_frame: arm_base
    nozzle_frame: spray_tip     # its +z axis = the spray direction

    # gpio backend only (sub-project 4): gpiochip, relay pin (BCM number, -1 = not set: the
    # node refuses to start), and true if the relay module switches on at a LOW pin.
    gpio_chip: 0
    gpio_pin: -1
    active_low: false

weed_aim:
  ros__parameters:
    # One aim -> spray -> park cycle per target on /aim_target or /clicked_point; report on
    # /aim/result. use_sim_time comes from the launch file (true in Gazebo).
    # Frames, files, keep_clear_shrink and ground_top are fixed at start (read-only); all
    # others are read again at the start of every cycle, so `ros2 param set` works for them.
    base_frame: base_link         # z = 0 is the ground; targets are converted to this frame
    arm_base_frame: arm_base      # the aim solver works in this frame
    laser_frame: laser_frame      # its height = the LiDAR scan plane the arm must keep out of
    nozzle_frame: spray_tip       # +z = spray direction: aim error and RViz nozzle line
    # '' = use the installed my_bot files; arm_aim.launch.py passes them explicitly.
    safety_yaml: ''               # config/safety.yaml: scan_self_filter box (LiDAR keep-clear)
    srdf_path: ''                 # config/moveit/weedbot.srdf: the park pose
    # The arm may cross the scan plane only inside the self-filter box made this much smaller on
    # every side (m), and "in the scan plane" means within +- scan_band (m) of its height.
    keep_clear_shrink: 0.02
    scan_band: 0.03
    # Aim choices tried by the solver: nozzle tilt from straight down up to tilt_max_deg, tip
    # standoff_min..standoff_max (m) from the weed, tip at least tip_clearance (m) above it.
    tilt_max_deg: 50.0
    standoff_min: 0.08
    standoff_max: 0.25
    tip_clearance: 0.03
    # Ask the spray controller to spray after aiming (false = aim, measure, park only). The spray
    # controller still makes every safety decision itself.
    spray: true
    # MoveIt speed: fraction of the limits in config/moveit/joint_limits.yaml.
    velocity_scaling: 0.5
    acceleration_scaling: 0.5
    # Arrived = every joint within arrive_tolerance_deg of the goal for arrive_hold s AND the arm
    # still: every joint moved less than arrive_still_speed (rad/s) x arrive_hold over the last
    # arrive_hold s (measured like spray_controller's "arm still" check). At most arrive_timeout s
    # after MoveIt finished; else "did not reach the aim pose" and park.
    # arrive_still_speed MUST stay below spray_controller's arm_still_speed (0.02, above): it is
    # half of it on purpose, so the spray controller never sees "arm moving" right after weed_aim
    # said "arrived" (their windows are a few ms apart). arrive_hold should be >= its
    # arm_still_time (0.3).
    arrive_tolerance_deg: 1.0
    arrive_hold: 0.3
    arrive_still_speed: 0.01
    arrive_timeout: 15.0
    planning_time: 5.0            # s, MoveIt planning time limit per move
    # Ground box added to MoveIt's world at start (4 x 4 x 0.1 m, in base_link): its top is this
    # high (m), so MoveIt keeps every arm part at least that far above the ground.
    ground_top: 0.02
