bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0       # half the CPU of 20 Hz; plenty for 0.22 m/s
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.5
    # Regulated Pure Pursuit: follows the given path smoothly (no trajectory sampling like DWB),
    # slows down in tight curves and near obstacles, turns in place when the path points behind.
    # Speed caps (CLAUDE.md): max_vel_x <= 0.3 m/s, max_vel_theta <= 1.0 rad/s.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.25
      min_lookahead_dist: 0.15          # small: coverage U-turns have a 0.2 m radius
      max_lookahead_dist: 0.45
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 0.8
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.7
      max_angular_accel: 2.0
      allow_reversing: false
      transform_tolerance: 0.5         # accept slightly old TF on a busy CPU instead of failing
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true      # checks the footprint along the next second of motion
      max_allowed_time_to_collision_up_to_carrot: 0.4   # ~0.09 m ahead at full speed (0.8 gave
                                                       # false stops beside walls; keep the check ON)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 6.0 # must equal the LOCAL inflation layer cost_scaling_factor
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Robot outline from the URDF collision shapes (base_link = wheel axle): 0.30 m long
      # (0.20 ahead of the axle, 0.10 behind), 0.45 m wide incl. wheels. Corners are 0.30 m from
      # the axle. Update together with robot_core.xacro after the drivetrain rebuild.
      footprint: "[[0.20, 0.225], [0.20, -0.225], [-0.10, -0.225], [-0.10, 0.225]]"
      footprint_padding: 0.01
      transform_tolerance: 0.5         # keep laser scans that arrive a little late (busy CPU)
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0    # steep fall-off keeps narrow gaps usable
        inflation_radius: 0.45      # >= corner radius 0.31 (needed for footprint collision checks)
      obstacle_layer:                  # plain 2D layer: a 2D LiDAR needs no 3D voxels (less CPU)
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered        # robot self-hits removed (scan_self_filter)
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true           # "no return" clears the cell line to max range (people leave no trail)
          observation_persistence: 0.0 # only the latest scan marks (moving obstacles vanish at once)
          expected_update_rate: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # Planner (SmacPlanner2D) plans for a point: a circle of HALF THE ROBOT WIDTH (0.225 + 0.01
      # padding) makes it use only gaps the robot fits through. (With the rectangle, the inscribed
      # radius would be 0.11 m because base_link is on the rear axle, and the planner would aim
      # for 0.22 m gaps.) The local costmap keeps the real rectangle for exact collision checks.
      robot_radius: 0.225
      footprint_padding: 0.01
      transform_tolerance: 0.5         # keep laser scans that arrive a little late (busy CPU)
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered        # robot self-hits removed (scan_self_filter)
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          inf_is_valid: true           # "no return" clears the cell line to max range (people leave no trail)
          observation_persistence: 0.0 # only the latest scan marks (moving obstacles vanish at once)
          expected_update_rate: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.35   # global costmap (planner); > robot_radius so paths keep off walls
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0   # the BT replans at 1 Hz; 20 Hz only produced "missed rate" warnings
    use_sim_time: True
    planner_plugins: ["GridBased"]
    # SmacPlanner2D: plain A* on the costmap (cheap on the VM/Pi). A diff-drive robot turns in
    # place, so no Hybrid-A*/Dubin curves are needed (Hybrid often failed in the small room).
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0      # prefer the middle of free space
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0        # matches controller_frequency
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
