# Safety layer (sim AND real robot): every motion command passes the collision monitor.
#   twist_mux (/cmd_vel_mux) -> safety_state_node (speed governor, /cmd_vel_capped)
#     -> collision_monitor -> /diff_cont/cmd_vel_unstamped
# safety_state_node reads THIS file too and publishes /safety_state (clear | slow | stop).
# Robot outline (CAD v21, FRONT = drive-wheel end, base_link = ground under the drive axle): the
# Nav2 footprint in nav2_params.yaml, bounding box x -0.520 (caster tail) .. +0.175 (phone mount),
# y -0.158 .. +0.158.
# The coverage path keeps the robot centre >= 0.288 m from walls (straight) and >= 0.66 m where
# it turns: every zone below is designed not to touch walls along that path.
# LiDAR (v21): LD06 on the spray tank at the BACK (x -0.2495), scan plane 0.378 m above the ground.
# It sees NOTHING LOWER THAN 0.378 m (low boxes, pets, edging, pots). BLIND WEDGE STRAIGHT AHEAD:
# the parked arm hides +-10 deg around the centre line, measured from the LD06, so the wedge widens
# with distance (0.15-0.18 m wide at the stop band; as wide as the robot, 0.32 m, at x 0.65 = 0.47 m
# ahead of the front).
# Anything narrower than the wedge on the centre line (post, pole, leg) is invisible; a 0.4 m wide
# person straight ahead is only seen once its centre is closer than x ~0.9 (only its edges then).
# The phone camera looks there but is NOT part of this safety chain.
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel_capped"   # from safety_state_node (speed governor)
    cmd_vel_out_topic: "/diff_cont/cmd_vel_unstamped"
    transform_tolerance: 0.5
    source_timeout: 1.0          # no fresh /scan for 1 s -> treated as blocked: robot stops
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["StopBand", "SlowCorridor"]
    # Stop: band from the phone mount (0.175; scan_self_filter removes everything up to 0.18) to
    # 0.10 m ahead, robot-wide (0.32 m). A person/obstacle in front stops the robot ~0.10 m short
    # (only what the LD06 sees beside the arm's wedge, see BLIND WEDGE above). Walls beside the
    # coverage path (centre >= 0.288 m from walls, >= 0.66 m where it turns) never enter it:
    # farthest point 0.32 m.
    # (A full "outline + 0.10 m" box stopped the robot next to walls all the time; Nav2's
    # "approach" mode was tried and never triggered in this Humble version.) Collisions while
    # turning on the spot are covered by RPP's footprint collision check on the local costmap.
    StopBand:
      type: "polygon"
      points: [0.275, 0.16, 0.275, -0.16, 0.18, -0.16, 0.18, 0.16]
      action_type: "stop"
      max_points: 2              # 3+ laser points inside -> stop
      visualize: True
      polygon_pub_topic: "polygon_stop"
    # Slow (40 %): corridor 0.40 m ahead of the phone mount, robot-wide (not the sides, or the
    # robot would crawl along every wall). Its middle is inside the arm's blind wedge, see above.
    SlowCorridor:
      type: "polygon"
      points: [0.575, 0.16, 0.575, -0.16, 0.18, -0.16, 0.18, 0.16]
      action_type: "slowdown"
      max_points: 2
      slowdown_ratio: 0.4
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"     # robot self-hits removed (scan_self_filter)

scan_self_filter:
  ros__parameters:
    # Robot self-hits (v21: the parked arm, 0.25-0.36 m in front of the LD06, ~+-10 deg).
    # Footprint bounding box + 0.002-0.01 m; must stay inside stop_zone below. (= laser_filters
    # LaserScanBoxFilter in base_link, x -0.53..0.18, y -0.16..0.16, z 0..0.6: the scan plane at
    # z 0.378 is inside.)
    box: [-0.53, 0.18, -0.16, 0.16]

safety_state:
  ros__parameters:
    # stop: anything within the outline (bounding box) + 0.04 m on any side (closer than the
    # coverage path ever gets to walls), slow: anything in the SlowCorridor above, clear: otherwise.
    stop_zone: [0.215, 0.198, 0.215, -0.198, -0.56, -0.198, -0.56, 0.198]
    scan_topic: /scan_filtered
    e_stop_topic: /e_stop
    state_topic: /safety_state
    rate_hz: 10.0
    scan_timeout: 1.0            # older scan -> "stop" (fail safe; 0.5 s flickered when the CPU is busy)
    hold_time: 0.5               # keep slow/stop this long after the zone clears (no flicker)
    # Unknown obstacles (scan points > unknown_tolerance from anything on /map, e.g. a person):
    # within unknown_radius -> state "slow" and every command capped at unknown_speed.
    map_topic: /map
    unknown_radius: 1.5
    unknown_tolerance: 0.25            # m; covers localisation error and thin map walls
    unknown_min_points: 3
    unknown_speed: 0.08                # m/s
    unknown_hold: 1.0                  # s the cap stays on after the obstacle is gone
    cmd_in: /cmd_vel_mux
    cmd_out: /cmd_vel_capped
    speed_limit_topic: /speed_limit    # Nav2 controller_server speed limit
