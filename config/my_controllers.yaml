controller_manager:
  ros__parameters:
    update_rate: 10

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 10.0
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false   # robot_localization EKF publishes odom->base_link (config/ekf.yaml)
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.1895
    wheel_radius: 0.06985
    use_stamped_vel: false
    # Hard limits for EVERY command source (Nav2, keyboard, joystick): top speed 0.15 m/s.
    # No acceleration limit: a stop command goes to the wheels at once (fastest braking the
    # motors/PID allow). Command timeout 0.25 s (default 0.5): with the e-stop lock nothing is
    # published, so the wheels stop after this timeout.
    cmd_vel_timeout: 0.25
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.15
    linear.x.min_velocity: -0.15
    linear.x.has_acceleration_limits: false
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.has_acceleration_limits: false

joint_broad:
  ros__parameters:
    usage: "publishing joint states"
