# MoveIt 2 inverse kinematics for the arm (loaded by launch/arm_aim.launch.py).
# Only RViz's drag handle (MotionPlanning panel) uses it: the aim node solves the angles itself
# (scripts/aim_solver.py) and gives MoveIt joint goals.
# position_only_ik: the arm has only 4 joints (yaw + 3 pitch, no wrist roll), so it cannot reach
# every position AND every orientation; asking only for the tip's position lets KDL find an
# answer when the handle is dragged.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
